<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Area riservata – Votazioni</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .nm { font-weight: 700; } .tg { color: var(--muted); font-size: .8rem; font-weight: 400; }
    .only-m { display: none; } .only-d { display: block; } .only-di { display: inline; }
    .sortsel { display: none; }
    .rc { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; background: var(--card); }
    .rc .top { display: flex; gap: 10px; align-items: flex-start; }
    .rc .rk { width: 30px; height: 30px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; font-weight: 700; flex: none; }
    .rc:nth-child(-n+3) .rk { background: var(--brand); color: var(--brand-ink); }
    .rc .rt { flex: 1; min-width: 0; line-height: 1.25; }
    .rc .rt .nm { font-size: 1.05rem; color: var(--brand); }
    .rc .rtot { text-align: right; flex: none; }
    .rc .rtot b { font-size: 1.6rem; line-height: 1; display: block; }
    .rc .rtot small { color: var(--muted); font-size: .75rem; }
    .rc .cr { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; margin-top: 10px; }
    .rc .c { font-size: .8rem; }
    .rc .c .l { display: flex; justify-content: space-between; gap: 6px; }
    .rc .c .l span { color: var(--muted); } .rc .c .l b { font-variant-numeric: tabular-nums; }
    .rc .c .b { height: 5px; border-radius: 9px; background: var(--line); margin-top: 3px; overflow: hidden; }
    .rc .c .b i { display: block; height: 100%; background: var(--brand); }
    #vseg button { white-space: nowrap; padding: 8px 12px; font-size: .9rem; }
    /* votanti a schede */
    .vc { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; background: var(--card); }
    .vc .h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .vc .h b { font-size: 1.05rem; } .vc .h span { color: var(--muted); font-size: .85rem; }
    .vc .bar { margin: 8px 0 10px; }
    .vc .acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .vc .acts button { padding: 8px 12px; font-size: .88rem; }
    /* chi ha votato */
    details.dv { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; background: var(--card); }
    details.dv > summary { list-style: none; cursor: pointer; padding: 11px 12px; display: flex; gap: 8px; align-items: center; }
    details.dv > summary::-webkit-details-marker { display: none; }
    details.dv > summary::after { content: "▾"; color: var(--muted); margin-left: 2px; }
    details.dv[open] > summary::after { content: "▴"; }
    .sn { flex: 1; min-width: 0; line-height: 1.25; }
    .sn .nm { color: var(--brand); display: block; } .sn .tg { display: block; }
    .pill.ok { background: var(--ok); color: #fff; } .pill.no { background: var(--chip); color: var(--muted); }
    .dd { padding: 2px 12px 12px; border-top: 1px solid var(--line); }
    .lab { font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 12px 0 6px; font-weight: 600; }
    .vr { padding: 7px 0; border-top: 1px solid var(--line); } .vr:first-of-type { border-top: 0; }
    .vr .l1 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .vr .l1 small, .vr small { color: var(--muted); }
    .chs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .ch { background: var(--chip); border-radius: 6px; padding: 1px 7px; font-size: .78rem; white-space: nowrap; } .ch b { margin-left: 2px; }
    .nv { display: flex; flex-wrap: wrap; gap: 6px; }
    .nv span { border: 1px dashed var(--line); color: var(--muted); border-radius: 99px; padding: 2px 10px; font-size: .85rem; }
    .vfilters { display: grid; gap: 8px; margin-bottom: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
    .vsum { display: flex; gap: 6px; align-items: baseline; font-variant-numeric: tabular-nums; }
    .vsum b { font-size: 1.1rem; }
    .vv { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; background: var(--card); }
    .vv .l1 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .vv .who { font-weight: 700; } .vv .st { color: var(--brand); font-weight: 600; }
    @media (max-width: 760px) {
      .only-m { display: block; } .only-d, .only-di { display: none; }
      .sortsel { display: block; margin-bottom: 10px; }
      .wrap.wide { padding: 12px; } h1 { font-size: 1.25rem; }
      .tabs button { padding: 8px 10px; font-size: .9rem; }
    }
  </style>
</head>
<body>
<div class="wrap wide" id="app"></div>
<script>
const app = document.getElementById("app");
let pw = "";
try { pw = sessionStorage.getItem("adminpw") || ""; } catch {}
const SHORT = { innovazione: "Inn", fattibilita: "Fat", impatto: "Imp", team: "Team", scalabilita: "Sca", esg: "ESG", mercato: "Mer" };
const gsp = (x) => { const k = x.indexOf(": "); return k > 0 ? { n: x.slice(0, k), t: x.slice(k + 2) } : { n: x, t: "" }; };
const fmtT = (ts) => (ts ? new Date(ts).toLocaleString("it-IT", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "");
const sumOf = (e) => Object.values(e.scores).reduce((a, b) => a + b, 0);
const normS = (x) => String(x).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const chipsHtml = (e) => state.config.criteria.map((c) => `<span class="ch" title="${esc(c.label)}">${SHORT[c.id] || esc(c.label.slice(0, 3))}<b>${e.scores[c.id]}</b></span>`).join("");
let vmode = "startup", vq = "", vVoter = "", vStart = "", openSet = new Set();
let state = null, tab = "rank", timer = null, sortKey = "total", editing = false;

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => (Number.isFinite(n) ? n.toFixed(2).replace(".", ",") : "–");

async function call(action, extra = {}) {
  const r = await fetch("/api/admin/" + action, {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ password: pw, ...extra }),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || "Errore");
  return data;
}

function login(error = "") {
  clearInterval(timer);
  app.innerHTML = `
    <div class="card" style="max-width:420px;margin:12vh auto 0">
      <h1>Area riservata</h1>
      <form id="f" class="row"><input class="grow" id="p" type="password" placeholder="Password admin" autofocus><button class="primary">Entra</button></form>
      <div class="err">${esc(error)}</div>
    </div>`;
  document.getElementById("f").onsubmit = async (e) => {
    e.preventDefault();
    pw = document.getElementById("p").value;
    await refresh(true);
  };
}

async function refresh(first = false) {
  try {
    state = await call("state");
    try { sessionStorage.setItem("adminpw", pw); } catch {}
    if (first) { render(); clearInterval(timer); timer = setInterval(() => refresh(), 5000); }
    else if (!editing) { if (tab === "votes" && document.getElementById("vlist")) renderVotesList(); else render(); }
  } catch (e) {
    if (first || /errata/.test(e.message)) login(e.message);
  }
}

// ---- calcoli ----
function compute() {
  const { config: cfg, votes } = state;
  const rows = cfg.startups.map((name, i) => {
    const per = Object.fromEntries(cfg.criteria.map((c) => [c.id, 0]));
    let n = 0;
    for (const v of cfg.voters) {
      const e = votes[v.id] && votes[v.id][i];
      if (!e) continue;
      n++;
      for (const c of cfg.criteria) per[c.id] += e.scores[c.id];
    }
    const total = Object.values(per).reduce((a, b) => a + b, 0);
    return { i, name, n, per, total, avg: n ? total / n : NaN,
      avgPer: Object.fromEntries(cfg.criteria.map((c) => [c.id, n ? per[c.id] / n : NaN])) };
  });
  const prog = cfg.voters.map((v) => ({ v, done: Object.keys(votes[v.id] || {}).length }));
  return { rows, prog };
}

function render() {
  editing = tab === "startups";
  const { config: cfg } = state;
  const { rows, prog } = compute();
  const totalVotes = rows.reduce((a, r) => a + r.n, 0);
  const expected = cfg.voters.length * cfg.startups.length;
  app.innerHTML = `
    <div class="row">
      <h1 class="grow"><span class="live"></span>Area riservata</h1>
      <span class="pill">${totalVotes} / ${expected} valutazioni (${Math.round((totalVotes / expected) * 100) || 0}%)</span>
      <span class="pill">${cfg.open ? "Votazioni APERTE" : "Votazioni CHIUSE"}</span>
    </div>
    <div class="tabs">
      ${[["rank", "Classifica"], ["votes", "Voti"], ["voters", "Votanti e link"], ["startups", "Startup"], ["settings", "Impostazioni"]]
        .map(([k, l]) => `<button data-tab="${k}" class="${tab === k ? "on" : ""}">${l}</button>`).join("")}
    </div>
    <div id="body"></div>`;
  app.querySelectorAll("[data-tab]").forEach((b) => (b.onclick = () => { tab = b.dataset.tab; render(); }));
  ({ rank: tabRank, votes: tabVotes, voters: tabVoters, startups: tabStartups, settings: tabSettings })[tab](rows, prog);
}

function tabRank(rows) {
  const cfg = state.config, MAXS = 5;
  const sorted = [...rows].sort((a, b) =>
    sortKey === "total" ? b.total - a.total
    : sortKey === "avg" ? (b.avg || 0) - (a.avg || 0)
    : sortKey === "name" ? a.name.localeCompare(b.name)
    : (b.per[sortKey] || 0) - (a.per[sortKey] || 0));
  const sp = (s) => { const k = s.indexOf(": "); return k > 0 ? { n: s.slice(0, k), t: s.slice(k + 2) } : { n: s, t: "" }; };
  const opts = [["total", "Totale"], ["avg", "Media"], ["name", "Nome"], ...cfg.criteria.map((c) => [c.id, c.label])];

  const table = `<div class="scroll only-d"><table>
      <thead><tr>
        <th>#</th><th data-s="name">Startup</th><th class="num">Voti</th>
        ${cfg.criteria.map((c) => `<th class="num" data-s="${c.id}" title="Somma ${esc(c.label)}">${esc(c.label)}</th>`).join("")}
        <th class="num" data-s="avg">Media</th><th class="num" data-s="total">TOTALE</th>
      </tr></thead>
      <tbody>${sorted.map((r, k) => { const x = sp(r.name); return `<tr>
        <td>${k + 1}</td><td><div class="nm">${esc(x.n)}</div><div class="tg">${esc(x.t)}</div></td><td class="num">${r.n}/${cfg.voters.length}</td>
        ${cfg.criteria.map((c) => `<td class="num" title="media ${fmt(r.avgPer[c.id])}">${r.per[c.id]}</td>`).join("")}
        <td class="num">${fmt(r.avg)}</td><td class="num"><b>${r.total}</b></td></tr>`; }).join("")}</tbody>
    </table></div>`;

  const cards = `<div class="only-m">
      <select class="sortsel" id="sortsel">${opts.map(([v, l]) => `<option value="${v}" ${v === sortKey ? "selected" : ""}>Ordina per: ${esc(l)}</option>`).join("")}</select>
      ${sorted.map((r, k) => { const x = sp(r.name); return `<div class="rc">
        <div class="top">
          <div class="rk">${k + 1}</div>
          <div class="rt"><div class="nm">${esc(x.n)}</div><div class="tg">${esc(x.t)}</div></div>
          <div class="rtot"><b>${r.total}</b><small>media ${fmt(r.avg)} · ${r.n}/${cfg.voters.length} voti</small></div>
        </div>
        <div class="cr">${cfg.criteria.map((c) => `<div class="c">
          <div class="l"><span>${esc(c.label)}</span><b>${r.per[c.id]}</b></div>
          <div class="b"><i style="width:${r.n ? Math.min(100, (r.per[c.id] / (r.n * MAXS)) * 100) : 0}%"></i></div></div>`).join("")}</div>
      </div>`; }).join("")}</div>`;

  document.getElementById("body").innerHTML = `
    <div class="card">
      <div class="row"><h2 class="grow">Classifica live</h2><button id="csv">Esporta CSV</button></div>
      <p class="muted" style="margin:0 0 10px">Totale = somma di tutti i punteggi di tutti i giurati.<span class="only-di"> Clicca su un'intestazione per ordinare.</span></p>
      ${table}${cards}
    </div>`;
  document.querySelectorAll("[data-s]").forEach((th) => { th.style.cursor = "pointer"; th.onclick = () => { sortKey = th.dataset.s; render(); }; });
  document.getElementById("sortsel").onchange = (e) => { sortKey = e.target.value; render(); };
  document.getElementById("csv").onclick = () => exportCsv(sorted);
}

function exportCsv(sorted) {
  const cfg = state.config;
  const q = (v) => `"${String(v).replace(/"/g, '""')}"`;
  const head = ["Posizione", "Startup", "N. voti", ...cfg.criteria.map((c) => c.label), "Media", "Totale"];
  const lines = [head.map(q).join(";")];
  sorted.forEach((r, k) => lines.push([k + 1, r.name, r.n, ...cfg.criteria.map((c) => r.per[c.id]), fmt(r.avg), r.total].map(q).join(";")));
  // dettaglio per giurato
  lines.push("", ["Giurato", "Startup", ...cfg.criteria.map((c) => c.label), "Somma"].map(q).join(";"));
  for (const v of cfg.voters) for (const [i, e] of Object.entries(state.votes[v.id] || {})) {
    const vals = cfg.criteria.map((c) => e.scores[c.id]);
    lines.push([v.name, cfg.startups[i], ...vals, vals.reduce((a, b) => a + b, 0)].map(q).join(";"));
  }
  // matrice startup x giurato: somma punteggi, vuoto = non ha votato
  lines.push("", ["Startup \\ Giurato", ...cfg.voters.map((v) => v.name)].map(q).join(";"));
  cfg.startups.forEach((nm, i) => lines.push([nm, ...cfg.voters.map((v) => { const e = state.votes[v.id] && state.votes[v.id][i]; return e ? sumOf(e) : ""; })].map(q).join(";")));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + lines.join("\n")], { type: "text/csv;charset=utf-8" }));
  a.download = "risultati-votazioni.csv"; a.click();
}

function tabVoters(_, prog) {
  const cfg = state.config, n = cfg.startups.length;
  const link = (v) => `${location.origin}/v/${v.token}#${v.password}`;
  document.getElementById("body").innerHTML = `
    <div class="card">
      <div class="row"><h2 class="grow">Votanti (${cfg.voters.length})</h2><button id="copyall">Copia tutti i link</button></div>
      <p class="muted" style="margin:0 0 10px">Il link contiene già l'accesso (la password dopo il #): basta inviarlo e il votante entra direttamente. Il link senza la parte dopo il # chiede invece la password.</p>
      <div class="scroll only-d"><table>
        <thead><tr><th>Nome</th><th>Link personale</th><th>Password</th><th class="num">Avanzamento</th><th></th></tr></thead>
        <tbody>${prog.map(({ v, done }) => `<tr>
          <td><b>${esc(v.name)}</b></td>
          <td><button data-copy="${esc(link(v))}">Copia link</button></td>
          <td><code class="k">${esc(v.password)}</code></td>
          <td class="num">${done}/${n}</td>
          <td class="row" style="gap:6px">
            <button data-reset="${v.id}" title="Genera nuovo link e password">Rigenera</button>
            <button class="danger" data-del="${v.id}">Elimina</button></td></tr>`).join("")}</tbody>
      </table></div>
      <div class="only-m">${prog.map(({ v, done }) => `<div class="vc">
        <div class="h"><b>${esc(v.name)}</b><span>${done}/${n} votate</span></div>
        <div class="bar"><i style="width:${(done / n) * 100}%"></i></div>
        <div class="acts">
          <button class="primary" data-copy="${esc(link(v))}">Copia link</button>
          <code class="k">${esc(v.password)}</code>
          <span class="grow"></span>
          <button data-reset="${v.id}">Rigenera</button>
          <button class="danger" data-del="${v.id}">Elimina</button>
        </div></div>`).join("")}</div>
      <form id="addf" class="row" style="margin-top:14px"><input class="grow" id="newname" placeholder="Aggiungi votante…"><button class="primary">Aggiungi</button></form>
    </div>`;
  document.querySelectorAll("[data-copy]").forEach((b) => (b.onclick = () => copy(b.dataset.copy, b)));
  document.getElementById("copyall").onclick = (e) => copy(
    cfg.voters.map((v) => `${v.name}\n${link(v)}`).join("\n\n"), e.target);
  document.querySelectorAll("[data-reset]").forEach((b) => (b.onclick = async () => {
    if (confirm("Rigenerare link e password? Quelli vecchi smetteranno di funzionare (i voti restano).")) { state = await call("reset-voter", { id: b.dataset.reset }); render(); }
  }));
  document.querySelectorAll("[data-del]").forEach((b) => (b.onclick = async () => {
    if (confirm("Eliminare il votante e TUTTI i suoi voti?")) { state = await call("remove-voter", { id: b.dataset.del }); render(); }
  }));
  document.getElementById("addf").onsubmit = async (e) => {
    e.preventDefault();
    const name = document.getElementById("newname").value.trim();
    if (name) { state = await call("add-voter", { name }); render(); }
  };
}

// ---------- Scheda "Voti": chi ha votato / chi no, per startup, per votante, voto per voto ----------
function tabVotes() {
  const cfg = state.config;
  const sortedStartups = cfg.startups.map((nm, i) => ({ i, nm })).sort((a, b) => gsp(a.nm).n.localeCompare(gsp(b.nm).n, "it", { sensitivity: "base" }));
  document.getElementById("body").innerHTML = `
    <div class="card">
      <div class="row"><h2 class="grow">Chi ha votato</h2><button id="csv2">Esporta CSV</button></div>
      <div class="seg" id="vseg" style="margin:10px 0;display:inline-flex">
        ${[["startup", "Per startup"], ["voter", "Per votante"], ["all", "Tutti i voti"]].map(([k, l]) => `<button data-m="${k}" class="${vmode === k ? "on" : ""}">${l}</button>`).join("")}
      </div>
      <div class="vfilters" id="vfilters">
        ${vmode === "all" ? `
          <select id="fv"><option value="">Tutti i votanti</option>${cfg.voters.map((v) => `<option value="${v.id}" ${vVoter === v.id ? "selected" : ""}>${esc(v.name)}</option>`).join("")}</select>
          <select id="fs"><option value="">Tutte le startup</option>${sortedStartups.map(({ i, nm }) => `<option value="${i}" ${vStart === String(i) ? "selected" : ""}>${esc(gsp(nm).n)}</option>`).join("")}</select>`
        : `<input id="fq" type="search" autocomplete="off" placeholder="${vmode === "startup" ? "Cerca startup…" : "Cerca votante…"}" value="${esc(vq)}">`}
      </div>
      <div id="vlist"></div>
    </div>`;
  document.querySelectorAll("#vseg button").forEach((b) => (b.onclick = () => { vmode = b.dataset.m; vq = ""; render(); }));
  const fq = document.getElementById("fq"); if (fq) fq.oninput = (e) => { vq = e.target.value; renderVotesList(); };
  const fv = document.getElementById("fv"); if (fv) fv.onchange = (e) => { vVoter = e.target.value; renderVotesList(); };
  const fs = document.getElementById("fs"); if (fs) fs.onchange = (e) => { vStart = e.target.value; renderVotesList(); };
  document.getElementById("csv2").onclick = () => exportCsv(compute().rows);
  renderVotesList();
}

function renderVotesList() {
  const cfg = state.config, votes = state.votes, N = cfg.voters.length, M = cfg.startups.length;
  const el = document.getElementById("vlist"); if (!el) return;
  const nq = normS(vq.trim());
  let html = "";

  if (vmode === "startup") {
    const list = cfg.startups.map((nm, i) => ({ i, nm })).filter(({ nm }) => !nq || normS(nm).includes(nq))
      .sort((a, b) => gsp(a.nm).n.localeCompare(gsp(b.nm).n, "it", { sensitivity: "base" }));
    html = list.map(({ i, nm }) => {
      const yes = cfg.voters.filter((v) => votes[v.id] && votes[v.id][i]);
      const no = cfg.voters.filter((v) => !(votes[v.id] && votes[v.id][i]));
      const key = "s" + i, x = gsp(nm);
      return `<details class="dv" data-k="${key}" ${openSet.has(key) ? "open" : ""}>
        <summary><div class="sn"><span class="nm">${esc(x.n)}</span><span class="tg">${esc(x.t)}</span></div>
          <span class="pill ok">${yes.length} ✓</span><span class="pill no">${no.length} ✗</span></summary>
        <div class="dd">
          <div class="lab">Hanno votato (${yes.length})</div>
          ${yes.length ? yes.map((v) => { const e = votes[v.id][i]; return `<div class="vr">
            <div class="l1"><b>${esc(v.name)}</b><span class="vsum"><b>${sumOf(e)}</b><small>/ ${cfg.criteria.length * 5}</small></span></div>
            <div class="chs">${chipsHtml(e)}</div><small>${fmtT(e.ts)}</small></div>`; }).join("") : '<div class="muted">Nessuno</div>'}
          <div class="lab">Non hanno votato (${no.length})</div>
          ${no.length ? `<div class="nv">${no.map((v) => `<span>${esc(v.name)}</span>`).join("")}</div>` : '<div class="muted">Hanno votato tutti ✓</div>'}
        </div></details>`;
    }).join("");
  } else if (vmode === "voter") {
    const list = cfg.voters.filter((v) => !nq || normS(v.name).includes(nq)).sort((a, b) => a.name.localeCompare(b.name, "it", { sensitivity: "base" }));
    html = list.map((v) => {
      const mine = votes[v.id] || {};
      const doneIdx = cfg.startups.map((_, i) => i).filter((i) => mine[i])
        .sort((a, b) => gsp(cfg.startups[a]).n.localeCompare(gsp(cfg.startups[b]).n, "it", { sensitivity: "base" }));
      const todo = cfg.startups.map((_, i) => i).filter((i) => !mine[i])
        .sort((a, b) => gsp(cfg.startups[a]).n.localeCompare(gsp(cfg.startups[b]).n, "it", { sensitivity: "base" }));
      const key = "v" + v.id;
      return `<details class="dv" data-k="${key}" ${openSet.has(key) ? "open" : ""}>
        <summary><div class="sn"><span class="nm">${esc(v.name)}</span><span class="tg">${doneIdx.length} di ${M} startup votate</span></div>
          <span class="pill ok">${doneIdx.length} ✓</span><span class="pill no">${todo.length} ✗</span></summary>
        <div class="dd">
          <div class="lab">Ha votato (${doneIdx.length})</div>
          ${doneIdx.length ? doneIdx.map((i) => { const e = mine[i]; return `<div class="vr">
            <div class="l1"><b>${esc(gsp(cfg.startups[i]).n)}</b><span class="vsum"><b>${sumOf(e)}</b><small>/ ${cfg.criteria.length * 5}</small></span></div>
            <div class="chs">${chipsHtml(e)}</div><small>${fmtT(e.ts)}</small></div>`; }).join("") : '<div class="muted">Nessuna</div>'}
          <div class="lab">Non ha ancora votato (${todo.length})</div>
          ${todo.length ? `<div class="nv">${todo.map((i) => `<span>${esc(gsp(cfg.startups[i]).n)}</span>`).join("")}</div>` : '<div class="muted">Ha votato tutte ✓</div>'}
        </div></details>`;
    }).join("");
  } else {
    const all = [];
    for (const v of cfg.voters) for (const [i, e] of Object.entries(votes[v.id] || {})) {
      if (vVoter && v.id !== vVoter) continue;
      if (vStart !== "" && String(i) !== vStart) continue;
      all.push({ v, i: +i, e });
    }
    all.sort((a, b) => b.e.ts - a.e.ts);
    const CAP = 300;
    html = `<p class="muted" style="margin:0 0 8px">${all.length} voti${all.length > CAP ? ` (mostro i ${CAP} più recenti: usa i filtri)` : ""}, dal più recente.</p>` +
      all.slice(0, CAP).map(({ v, i, e }) => `<div class="vv">
        <div class="l1"><span><span class="who">${esc(v.name)}</span> → <span class="st">${esc(gsp(cfg.startups[i]).n)}</span></span>
          <span class="vsum"><b>${sumOf(e)}</b><small>/ ${cfg.criteria.length * 5}</small></span></div>
        <div class="chs">${chipsHtml(e)}</div><small class="muted">${fmtT(e.ts)}</small></div>`).join("");
    if (!all.length) html = '<div class="muted" style="padding:16px 0">Nessun voto con questi filtri.</div>';
  }
  el.innerHTML = html || '<div class="muted" style="padding:16px 0">Nessun risultato.</div>';
  el.querySelectorAll("details[data-k]").forEach((d) => (d.ontoggle = () => (d.open ? openSet.add(d.dataset.k) : openSet.delete(d.dataset.k))));
}

async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); const o = btn.textContent; btn.textContent = "Copiato ✓"; setTimeout(() => (btn.textContent = o), 1200); }
  catch { prompt("Copia manualmente:", text); }
}

function tabStartups() {
  const cfg = state.config;
  document.getElementById("body").innerHTML = `
    <div class="card">
      <h2>Elenco startup (${cfg.startups.length})</h2>
      <p class="muted" style="margin:0 0 10px">Una startup per riga, nell'ordine in cui compariranno ai giurati. Puoi rinominare in qualsiasi momento: i voti restano legati alla <b>posizione</b>, quindi non spostare né cancellare righe a votazioni iniziate.</p>
      <textarea id="names">${esc(cfg.startups.join("\n"))}</textarea>
      <div class="row" style="margin-top:10px"><button class="primary" id="savenames">Salva elenco</button><span id="msg" class="muted"></span></div>
    </div>`;
  document.getElementById("savenames").onclick = async () => {
    const names = document.getElementById("names").value.split("\n");
    try { state = await call("startups", { names }); document.getElementById("msg").textContent = "Salvato ✓"; }
    catch (e) { document.getElementById("msg").textContent = e.message; }
  };
}

function tabSettings() {
  const cfg = state.config;
  document.getElementById("body").innerHTML = `
    <div class="card">
      <h2>Stato votazioni</h2>
      <p class="muted">Quando chiudi le votazioni i giurati possono solo consultare i propri voti.</p>
      <button class="${cfg.open ? "danger" : "primary"}" id="toggle">${cfg.open ? "Chiudi le votazioni" : "Riapri le votazioni"}</button>
    </div>
    <div class="card">
      <h2>Criteri di valutazione</h2>
      <p class="muted">Punteggio da 1 a 5 per ciascun criterio.</p>
      <div class="row">${cfg.criteria.map((c) => `<span class="pill">${esc(c.label)}</span>`).join("")}</div>
    </div>`;
  document.getElementById("toggle").onclick = async () => { state = await call("open", { open: !cfg.open }); render(); };
}

if (pw) refresh(true); else login();
